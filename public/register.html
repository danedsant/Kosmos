<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosmos - Registro</title>
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <canvas id="cosmosCanvas"></canvas>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="../img/logo.png" alt="Kosmos" class="auth-logo-img">
                <span>Kosmos</span>
            </div>
            <h2 class="auth-title">Crear Cuenta</h2>
            <form id="register-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="reg-nombre" class="form-control" required placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label>Apellido</label>
                        <input type="text" id="reg-apellido" class="form-control" required placeholder="Tu apellido">
                    </div>
                </div>
                <div class="form-group">
                    <label>Cedula</label>
                    <input type="text" id="reg-cedula" class="form-control" required placeholder="Ej: V-20.123.456">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" class="form-control" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label>Contrasena</label>
                    <input type="password" id="reg-password" class="form-control" required placeholder="Minimo 6 caracteres" minlength="6">
                </div>
                <div id="register-error" class="auth-error" style="display:none"></div>
                <button type="submit" class="btn btn-full">Registrarme</button>
            </form>
            <div class="auth-footer">
                <p>Ya tienes cuenta? <a href="login.html">Inicia sesion</a></p>
            </div>
        </div>
    </div>
    <script src="js/cosmic.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('register-error');
            errorDiv.style.display = 'none';

            const payload = {
                nombre: document.getElementById('reg-nombre').value,
                apellido: document.getElementById('reg-apellido').value,
                cedula: document.getElementById('reg-cedula').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value
            };

            try {
                const res = await fetch('../api/auth.php?accion=registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.status === 'success') {
                    localStorage.setItem('kosmos_user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Error de conexion.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
